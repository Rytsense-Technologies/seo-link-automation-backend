[project]
name = "seo-link-automation-backend"
version = "0.1.0"
description = "SEO link automation backend (FastAPI + PostgreSQL)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B008"]  # FastAPI Depends()/Query() in defaults

[tool.ruff.lint.per-file-ignores]
# Typographic quotes are matched on purpose when normalising page text.
"app/interlink/{anchor_rules,text_features}.py" = ["RUF001"]
"tests/**" = ["RUF001"]

[tool.mypy]
python_version = "3.11"
packages = ["app"]
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: requires a PostgreSQL database (TEST_DATABASE_URL)"]
